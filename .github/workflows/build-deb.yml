name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, used to compute the version

      - name: Check Python syntax
        run: python3 -m py_compile avell_kbd.py

      - name: Check shell scripts
        run: |
          bash -n install.sh install-driver.sh uninstall.sh packaging/build-deb.sh
          sh -n packaging/debian/postinst packaging/debian/prerm

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Show package info
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -v '/usr/src/.*/.*/'

      # Installs the .deb on the runner: proves the dependencies resolve and that
      # the driver compiles with DKMS against the runner's kernel. There is no
      # Clevo hardware here, so the module itself is not expected to find a device.
      - name: Test install / remove
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-headers-$(uname -r)"
          sudo apt-get install -y ./dist/*.deb
          dkms status | tee /dev/stderr | grep -q 'my-keyboard-app/.*: installed'
          test -x /usr/bin/avell-kbd
          AVELL_KBD_SYSFS="$(mktemp -d)" /usr/bin/avell-kbd --status || true
          sudo apt-get remove -y my-keyboard-app
          ! dkms status | grep -q my-keyboard-app

      - uses: actions/upload-artifact@v4
        with:
          name: my-keyboard-app-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
